# Baseline config for Pi-Long: its own knobs, nothing about which data to run on.
# Reusable across assets — pair it with a data config from configs/data/:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/pi-long.yaml
#
# Every field has a default in run_sequence.py's dataclasses; only override what you need.
# A copy of this, plus the data config and the variants that ran, is written to
# <asset>/predictions/<method>/config.yaml after each run.

model:
  # Path to a Pi-Long native config yaml (its own Weights/Model/Loop schema), resolved relative
  # to the Pi-Long submodule root if not absolute. Pick Pi3 vs Pi3X (Model.model_type), chunk_size,
  # overlap, loop closure, etc. there -- see Pi-Long/configs/base_config.yaml and its own README
  # for the full set of knobs (also several ready-made pi3/pi3x x se3/sim3 x chunk-size configs
  # under Pi-Long/configs/).
  config: configs/base_config.yaml

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: null                  # null = the baseline's registered name ("pi-long"); set it to
                                 # run two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  cloud: true                    # Pi-Long's own fused, confidence-filtered cloud (see its config's Model.Pointcloud_Save)
