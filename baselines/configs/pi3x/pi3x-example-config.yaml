# Example config for baselines/Pi3X/run_sequence.py.
# Every field has a default in run_sequence.py's Config dataclasses; only override what you need.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # asset folder, e.g. path to glass_house
  trajectory: trendspek             # null picks the only one, if there's just one
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null                # null = to the end
  frame_stride: 1

model:
  device: cuda
  hf_repo: yyfz233/Pi3X
  # ckpt: /path/to/model.safetensors   # local checkpoint, overrides hf_repo if set
  pixel_limit: 255000
  chunk_size: 16                 # Pi3XVO's own chunking -- frames processed per model call
  overlap: 6                     # frames shared between consecutive chunks, for Sim(3) alignment
  conf_thre: 0.05                # confidence floor Pi3XVO uses internally to align chunks

output:
  # -> predictions/pi3x/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/pi3x/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: pi3x                   # also the viewer's Source label
  overwrite: true
  min_confidence: 50.0            # percentile (0-100) of lowest-confidence points dropped from the cloud; null = keep everything
  cloud: true                    # fused .ply, unprojected from predicted depth + poses
