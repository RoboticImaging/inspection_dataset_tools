# Example config for baselines/depth_anything_3/run_sequence.py.
# Every field has a default in run_sequence.py's Config dataclasses; only override what you need.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # asset folder, e.g. path to glass_house
  trajectory: trendspek             # null picks the only one, if there's just one
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null              # null = to the end
  frame_stride: 1

model:
  hf_repo: depth-anything/DA3NESTED-GIANT-LARGE
  device: cuda
  process_res: 504
  chunk_size: 100                # one inference call per chunk; see run_sequence.py's docstring
  use_known_poses: false        # true = condition on gt cam params instead of predicting them
  use_ray_pose: false
  ref_view_strategy: saddle_balanced

output:
  method: da3                   # -> predictions/da3/... ; also the viewer's Source label
  overwrite: true
  min_confidence: null          # e.g. 0.5 to mask low-confidence pixels to nan
