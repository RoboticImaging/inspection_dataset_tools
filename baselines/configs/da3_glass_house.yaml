# Both halves of a run in one file — the shape configs had before the data/baseline split, still
# accepted verbatim: `python run_sequence.py ../configs/da3_glass_house.yaml`. Prefer the split
# form for new work (configs/data/old_house.yaml + configs/da3.yaml), since a data config is
# reusable across baselines and a baseline config across assets.
#
# Every field has a default in run_sequence.py's dataclasses; only override what you need.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # `asset:` is the current name for this
  # null on an axis now means *every* value the asset has on it, not "unspecified" — so this
  # file selects one sequence, while `illumination: null` here would select all of them.
  trajectory: trendspek
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null              # null = to the end
  frame_stride: 1

model:
  hf_repo: depth-anything/DA3NESTED-GIANT-LARGE
  device: cuda
  process_res: 504
  use_known_poses: false        # true = condition on gt cam params instead of predicting them
  use_ray_pose: false
  ref_view_strategy: saddle_balanced

output:
  # -> predictions/da3/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/da3/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: da3                   # also the viewer's Source label
  overwrite: true
  min_confidence: null          # e.g. 0.5 to mask low-confidence pixels to nan
  cloud: true                   # fused .ply, converted from DA3's own glb export (its defaults)
