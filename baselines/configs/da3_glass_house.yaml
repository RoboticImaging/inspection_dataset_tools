# Both halves of a run in one file — the shape configs had before the data/baseline split, still
# accepted as the single positional argument:
#
#   python run_sequence.py ../configs/da3_glass_house.yaml
#
# Prefer the split form for new work (configs/data/<asset>.yaml + configs/<baseline>.yaml): a
# data config is reusable across baselines, a baseline config across assets. The keys are the
# same either way — `dataset:` is the data config, `model:` + `output:` the baseline config — so
# the comments in those two files apply here as well. Only overrides are listed below.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/   # `asset:` is the current name for this
  trajectory: trendspek
  illumination: sunny
  soil: verylow

model:
  process_res: 504

output:
  method: da3
  overwrite: true
