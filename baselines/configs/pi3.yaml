# Baseline config for Pi3: its own knobs, nothing about which data to run on.
# Reusable across assets — pair it with a data config from configs/data/:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/pi3.yaml
#
# Every field has a default in run_sequence.py's dataclasses; only override what you need.
# A copy of this, plus the data config and the variants that ran, is written to
# <asset>/predictions/<method>/config.yaml after each run.

model:
  device: cuda
  hf_repo: yyfz233/Pi3
  # ckpt: /path/to/model.safetensors   # local checkpoint, overrides hf_repo if set
  pixel_limit: 255000

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: null                  # null = the baseline's registered name ("pi3"); set it to run
                                # two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  min_confidence: null          # absolute per-pixel depth cutoff -- Pi3 doesn't use this, see below
  cloud_confidence_percentile: 50.0  # percentile (0-100) of lowest-confidence points dropped from the cloud; null = keep everything
  cloud: true                    # fused .ply, unprojected from predicted depth + poses
