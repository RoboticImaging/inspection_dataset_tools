# Example config for baselines/VGGT-Long/run_sequence.py.
# Every field has a default in run_sequence.py's Config dataclasses; only override what you need.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # asset folder, e.g. path to glass_house
  trajectory: trendspek             # null picks the only one, if there's just one
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null                # null = to the end
  frame_stride: 1

model:
  # Path to a VGGT-Long native config yaml (its own Weights/Model/Loop schema), resolved relative
  # to the VGGT-Long submodule root if not absolute. Pick which foundation model VGGT-Long chunks
  # (VGGT/Pi3/Mapanything), chunk_size, overlap, loop closure, etc. there -- see
  # VGGT-Long/configs/base_config.yaml and its own README for the full set of knobs.
  config: configs/base_config.yaml

output:
  # -> predictions/vggt-long/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/vggt-long/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: vggt-long              # also the viewer's Source label
  overwrite: true
  cloud: true                    # VGGT-Long's own fused, confidence-filtered cloud (see its config's Model.Pointcloud_Save)
