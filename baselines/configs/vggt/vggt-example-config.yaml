# Example config for baselines/vggt/run_sequence.py.
# Every field has a default in run_sequence.py's Config dataclasses; only override what you need.

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # asset folder, e.g. path to glass_house
  trajectory: trendspek             # null picks the only one, if there's just one
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null                # null = to the end
  frame_stride: 1

model:
  device: cuda
  checkpoint_url: https://huggingface.co/facebook/VGGT-1B/resolve/main/model.pt

output:
  # -> predictions/vggt/{illumination}/{depths,cam_params}/ref={reflectivity},traj={traj}/
  #    predictions/vggt/{illumination}/clouds/ref={reflectivity},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/reflectivity never overwrite each other)
  method: vggt                   # also the viewer's Source label
  overwrite: true
  min_confidence: 25.0 # Give this as a percentage of points to filter out 
  cloud: true                    # fused .ply, unprojected from predicted depth + poses
