# Baseline config for classical COLMAP (sparse SfM + dense MVS): its own knobs, nothing about
# which data to run on. Reusable across assets — pair it with a data config from configs/data/:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/colmap.yaml
#
# Every field has a default in run_sequence.py's dataclasses -- colmap's own compiled-in default
# unless a comment there says otherwise -- only override what you need. Fields are grouped one
# nested block per underlying colmap command/option-namespace (feature_extractor's
# --ImageReader.*/--FeatureExtraction.*/--SiftExtraction.*, exhaustive_matcher's
# --FeatureMatching.*/--SiftMatching.*/--TwoViewGeometry.*/--ExhaustiveMatching.*, `colmap
# mapper`'s --Mapper.* across three groups, then patch_match_stereo's/stereo_fusion's own), so a
# group name here always matches the flag prefix it maps to -- see run_sequence.py's own
# `ModelConfig` for exactly which struct/file:line each default came from.
#
# A copy of this, plus the data config and the variants that ran, is written to
# <asset>/predictions/<method>/config.yaml after each run.

model:
  image_reader:
    camera_model: SIMPLE_PINHOLE   # self-calibrated, no known intrinsics fed in
    single_camera: true            # one shared camera for the whole sequence (a fixed render rig)
    single_camera_per_folder: false
    single_camera_per_image: false
    default_focal_length_factor: 1.2
    camera_params: null            # e.g. "fx,fy,cx,cy" -- null = self-calibrate from scratch
    mask_path: null
    camera_mask_path: null
    existing_camera_id: null

  feature_extraction:
    use_gpu: true
    num_threads: -1                # -1 = auto (all cores)
    gpu_index: "-1"                # "-1" = auto-select
    max_image_size: -1             # -1 = no downsampling before extraction

  sift_extraction:
    max_num_features: 8192
    first_octave: -1
    num_octaves: 4
    octave_resolution: 3
    peak_threshold: 0.006666666666666667   # colmap's own default: 0.02 / octave_resolution
    edge_threshold: 10.0
    estimate_affine_shape: false
    max_num_orientations: 2
    upright: false
    domain_size_pooling: false
    dsp_min_scale: 0.16666666666666666
    dsp_max_scale: 3.0
    dsp_num_scales: 10

  feature_matching:
    num_threads: -1
    use_gpu: true
    gpu_index: "-1"
    max_num_matches: 32768
    guided_matching: false
    skip_geometric_verification: false
    rig_verification: false
    skip_image_pairs_in_same_frame: false

  sift_matching:
    max_ratio: 0.8                 # Lowe's ratio test threshold
    max_distance: 0.7
    cross_check: true
    cpu_brute_force_matcher: false
    lightglue_min_score: 0.1       # only used if type selects LightGlue matching

  two_view_geometry:
    min_num_inliers: 15
    multiple_models: false
    compute_relative_pose: false
    detect_watermark: true
    multiple_ignore_watermark: true
    watermark_detection_max_error: 4.0
    filter_stationary_matches: false
    stationary_matches_max_error: 4.0
    use_degensac: false
    max_error: 4.0                 # RANSAC max reprojection/epipolar error, in pixels
    confidence: 0.999               # RANSAC confidence
    max_num_trials: 10000           # RANSAC max iterations
    min_inlier_ratio: 0.25          # RANSAC early-stop inlier ratio
    random_seed: -1

  exhaustive_matching:
    block_size: 50

  mapper:
    # `colmap mapper`'s top-level (IncrementalPipelineOptions) knobs.
    min_num_matches: 15
    ignore_watermarks: false
    # multiple_models: true # reconstruct every disconnected component (why the
                                    # merge_submodels step in run_sequence.py exists at all)
    max_num_models: 50
    max_model_overlap: 20
    min_model_size: 10
    init_image_id1: null           # null = auto-pick the initial image pair
    init_image_id2: null
    init_num_trials: 200
    structure_less_registration_fallback: true
    structure_less_registration_only: false
    extract_colors: true
    num_threads: -1
    random_seed: -1
    min_focal_length_ratio: 0.1    # bogus-camera-parameter filter (opening angle ~130deg)
    max_focal_length_ratio: 10.0   # (opening angle ~5deg)
    max_extra_param: 1.0
    ba_refine_focal_length: true
    ba_refine_principal_point: false
    ba_refine_extra_params: true
    ba_refine_sensor_from_rig: true
    ba_local_function_tolerance: 0.0
    ba_local_max_num_iterations: -1
    ba_global_frames_ratio: 1.1
    ba_global_points_ratio: 1.1
    ba_global_frames_freq: 500
    ba_global_points_freq: 250000
    ba_global_function_tolerance: 0.0
    ba_global_max_num_iterations: -1
    ba_local_max_refinements: 2
    ba_local_max_refinement_change: 0.001
    ba_global_max_refinements: 5
    ba_global_max_refinement_change: 0.0005
    ba_use_gpu: false
    ba_gpu_index: "-1"
    ba_local_backend: null         # "CERES" or "CASPAR"
    ba_global_backend: null
    ba_min_num_residuals_for_cpu_multi_threading: 50000
    snapshot_path: null            # periodic checkpoints; unused (short-lived scratch workspace)
    snapshot_frames_freq: 0        # 0 = disabled
    fix_existing_frames: false
    max_runtime_seconds: null      # null = unbounded

  incremental_mapper:
    # `colmap mapper`'s per-image-registration (IncrementalMapper::Options) knobs -- still
    # `Mapper.*` flags, just a different underlying struct (see run_sequence.py's own comment).
    init_min_num_inliers: 100
    init_max_error: 4.0
    init_max_forward_motion: 0.95
    init_min_tri_angle: 16.0
    init_max_reg_trials: 2
    abs_pose_max_error: 12.0
    abs_pose_min_num_inliers: 30
    abs_pose_min_inlier_ratio: 0.25
    filter_max_reproj_error: 4.0
    filter_min_tri_angle: 1.5
    max_reg_trials: 3
    ba_local_num_images: 6
    ba_local_min_tri_angle: 6.0
    ba_global_ignore_redundant_points3D: false
    ba_global_ignore_redundant_points3D_min_coverage_gain: 0.05

  triangulation:
    # `colmap mapper`'s --Mapper.tri_* flags (IncrementalTriangulator::Options).
    tri_max_transitivity: 1
    tri_create_max_angle_error: 2.0
    tri_continue_max_angle_error: 2.0
    tri_merge_max_reproj_error: 4.0
    tri_complete_max_reproj_error: 4.0
    tri_complete_max_transitivity: 5
    tri_re_max_angle_error: 5.0
    tri_re_min_ratio: 0.2
    tri_re_max_trials: 1
    tri_min_angle: 1.5
    tri_ignore_two_view_tracks: true

  patch_match:
    max_image_size: 480
    window_radius: 5
    window_step: 1
    sigma_spatial: 5.0
    sigma_color: 0.2
    num_samples: 15
    ncc_sigma: 0.6
    min_triangulation_angle: 1.0
    incident_angle_sigma: 0.9
    num_iterations: 5
    geom_consistency: false        # true also enables writing .geometric.bin depth maps
    geom_consistency_regularizer: 0.3
    geom_consistency_max_cost: 3.0
    filter: true
    filter_min_ncc: 0.1
    filter_min_triangulation_angle: 3.0
    filter_min_num_consistent: 2
    filter_geom_consistency_max_cost: 1.0
    num_threads: -1
    write_consistency_graph: false
    allow_missing_files: false

  stereo_fusion:
    max_image_size: 480
    min_num_pixels: 5
    max_num_pixels: 10000
    max_traversal_depth: 100
    max_reproj_error: 2.0
    max_depth_error: 0.01
    max_normal_error: 10.0
    check_num_images: 50
    use_cache: false
    cache_size: 32
    mask_path: null

  # stereo_fusion's own --input_type flag -- not under the StereoFusion.* namespace above.
  # geom_consistency: false (patch_match's default) means only photometric depth maps get
  # written, so "photometric" is the only source that will exist unless patch_match.
  # geom_consistency is also flipped on.
  depth_source: photometric      # "photometric" or "geometric"

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  #
  # Unlike the feed-forward baselines: COLMAP is classical incremental SfM + MVS, not a depth
  # model -- only frames it actually registered get written at all (a frame it couldn't place
  # gets no output, not a bad guess), and a registered frame patch_match_stereo never estimated a
  # depth map for still falls back to all-NaN. Pose and cloud are fully written either way, but
  # note COLMAP's own scale is left unrecovered (see run_sequence.py's module docstring) -- only
  # rotation+translation are aligned to gt, the same accepted convention VGGT-SLAM/VGGT-Long use.
  method: null                  # null = the baseline's registered name ("colmap"); set it to run
                                # two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  min_confidence: null          # COLMAP produces no per-pixel confidence map -- must stay null
  cloud: true                    # dense fused point cloud from stereo_fusion, not sparse SfM points
