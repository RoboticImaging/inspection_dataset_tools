# Data config: which asset, which of its sequences, which frames. Reusable by every baseline —
# pair it with a baseline config (e.g. ../da3.yaml) on the command line:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/da3.yaml
#
# Every axis takes one value, a list of values, or null = every value this asset has. Which
# values exist is discovered from the asset itself, so `null` everywhere runs the full cross
# product; an axis the asset doesn't vary (here: reflectivity) is simply left null.

asset: /home/jgray/eccv_2026_data/old_house/   # the asset folder, e.g. .../glass_house

trajectory: trendspek         # null = every trajectory (and so: the only one, if there's one)
illumination: sunny           # or [sunny, overcast], or null for all of them
soil: verylow                 # or `reflectivity:`, whichever axis this asset varies
reflectivity: null

frame_start: 0
frame_end: null               # exclusive; null = to the end
frame_stride: 1
