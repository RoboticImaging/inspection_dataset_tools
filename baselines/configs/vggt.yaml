# Baseline config for VGGT: its own knobs, nothing about which data to run on.
# Reusable across assets — pair it with a data config from configs/data/:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/vggt.yaml
#
# Every field has a default in run_sequence.py's dataclasses; only override what you need.
# A copy of this, plus the data config and the variants that ran, is written to
# <asset>/predictions/<method>/config.yaml after each run.

model:
  device: cuda
  checkpoint_url: https://huggingface.co/facebook/VGGT-1B/resolve/main/model.pt

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/ref={reflectivity},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/ref={reflectivity},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/reflectivity never overwrite each other)
  method: null                  # null = the baseline's registered name ("vggt"); set it to run
                                # two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  min_confidence: 50.0          # percentile (0-100) of lowest-confidence points dropped from the cloud; null = keep everything
  cloud: true                    # fused .ply, unprojected from predicted depth + poses
