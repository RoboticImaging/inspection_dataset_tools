# Example config for baselines/depth_anything_3/run_sequence.py, both halves in one file:
#
#   python run_sequence.py ../configs/depth-anything-3/depth-anything-3-example-config.yaml
#
# Every field has a default in run_sequence.py's dataclasses; only override what you need.
# A copy of this, plus the variants that ran, is written to <asset>/predictions/<method>/config.yaml
# after each run. To reuse the model:/output: half across assets instead, copy this file, drop its
# dataset: section, and pair it with a data config from configs/data/ via --model/--data (a file
# with a dataset: key isn't accepted as --model -- see baselines/common/config.py's own docstring
# for the two-halves convention).

dataset:
  root: /home/jgray/eccv_2026_data/old_house/     # asset folder, e.g. path to glass_house
  trajectory: trendspek             # null picks the only one, if there's just one
  illumination: sunny
  soil: verylow                    # or `reflectivity:`, whichever axis this asset varies
  frame_start: 0
  frame_end: null                # null = to the end
  frame_stride: 1

model:
  hf_repo: depth-anything/DA3NESTED-GIANT-LARGE
  device: cuda
  process_res: 504
  use_known_poses: false        # true = condition on gt cam params instead of predicting them
  use_ray_pose: false
  ref_view_strategy: saddle_balanced

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  method: null                  # null = the baseline's registered name ("da3"); set it to run
                                # two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  min_confidence: null          # e.g. 0.5 to mask low-confidence pixels to nan
  cloud: true                   # fused .ply, converted from DA3's own glb export (its defaults)
