# Baseline config for Pixel-Perfect SfM (`pixsfm`): classical COLMAP SfM + dense-feature
# keypoint/bundle refinement. Its own knobs, nothing about which data to run on. Reusable across
# assets — pair it with a data config from configs/data/:
#
#   python run_sequence.py --data ../configs/data/old_house.yaml --model ../configs/pixel-perfect-sfm.yaml
#
# Every field has a default in run_sequence.py's dataclasses. automatic_reconstructor through
# stereo_fusion (plus depth_source) are the same colmap-CLI knobs as ../configs/colmap.yaml, with the same
# meaning — see that file's own comments. automatic_reconstructor is identical to colmap.yaml's and
# covers feature extraction + matching only (`--sparse 0 --dense 0` are always passed): mapping
# stays a separate `colmap mapper` stage (mapper/incremental_mapper/triangulation below) so
# keypoint adjustment can run between matching and mapping. dense_features/interpolation/ka/ba are
# new here: they go to pixsfm's own Python API (pixsfm.refine_colmap.PixSfM), not colmap's CLI, and every
# default was read directly from this exact submodule's source, NOT from its own README (which
# is stale in several places — see run_sequence.py's module docstring for specifics).
#
# ------------------------------------------------------------------------------------------
# Memory and runtime: what to change first
# ------------------------------------------------------------------------------------------
# Dense-feature refinement is far more memory/time-hungry than plain COLMAP (baselines/colmap) --
# it holds a deep-feature patch (or map) per keypoint/observation in memory during optimization.
# If a run is slow or gets killed (OOM), pixel-perfect-sfm's own `low_memory.yaml` template
# (pixsfm/configs/low_memory.yaml) changes exactly these knobs, in this order of impact:
#
#   1. dense_features.sparse: true (already the default here) -- store a small patch per
#      keypoint instead of the full dense feature map per image. Leaving this false is the
#      single most expensive mistake to make with this baseline.
#   2. dense_features.patch_size: smaller (e.g. 8, down from the default 16) -- the patch stored
#      per keypoint scales as patch_size^2; halving it quarters that memory.
#   3. dense_features.use_cache: true (+ overwrite_cache: true, load_cache_on_init: false) --
#      stream features from an HDF5 file on disk instead of holding them all in RAM. Costs disk
#      I/O and some wall-clock time; saves the most RAM of any single knob here.
#   4. ka.strategy: topological_reference (from the default "featuremetric") -- linear rather
#      than quadratic cost in track size: "significantly faster... but slightly less accurate"
#      (pixsfm's own docstring). Also raise ka.max_kps_per_problem (e.g. to 1000) once patches
#      are already small -- fewer, bigger chunks trade some parallelism for less overhead.
#   5. ba.strategy: costmaps (from the default "feature_reference") -- "significantly reduces
#      RAM consumption" (pixsfm's own docstring) by precomputing a local cost volume per
#      observation instead of holding every dense feature in memory during bundle adjustment.
#      Raise ba.max_tracks_per_problem too (e.g. to 100), same rationale as ka's knob above.
#      Note pixsfm's own low_memory.yaml also turns off ba.optimizer.refine_* entirely when
#      using costmaps -- worth doing if BA is still too slow/memory-hungry with it alone.
#
# If you just want this baseline to behave exactly like baselines/colmap (skip the refinement
# and its cost entirely, e.g. to sanity-check the rest of the pipeline in isolation), set
# `ka.apply: false` and `ba.apply: false` — every colmap-CLI stage still runs unchanged.
#
# A copy of this, plus the data config and the variants that ran, is written to
# <asset>/predictions/<method>/config.yaml after each run.

model:
  automatic_reconstructor:
    data_type: video              # "individual" | "video" | "internet". "video" = sequential
                                  # matching of neighbouring frames, as in colmap_sparse_loop.sh
    quality: medium               # "low" | "medium" | "high" | "extreme"
    camera_model: SIMPLE_PINHOLE  # self-calibrated, no known intrinsics fed in
    single_camera: true           # one shared camera for the whole sequence (a fixed render rig)
    camera_params: null           # e.g. "fx,fy,cx,cy" -- null = self-calibrate from scratch
    use_gpu: true
    gpu_index: "-1"               # "-1" = auto-select
    num_threads: -1               # -1 = auto (all cores)

  mapper:
    min_num_matches: 15
    ignore_watermarks: false
    multiple_models: true
    max_num_models: 50
    max_model_overlap: 20
    min_model_size: 10
    init_image_id1: null
    init_image_id2: null
    init_num_trials: 200
    structure_less_registration_fallback: true
    structure_less_registration_only: false
    extract_colors: true
    num_threads: -1
    random_seed: -1
    min_focal_length_ratio: 0.1
    max_focal_length_ratio: 10.0
    max_extra_param: 1.0
    ba_refine_focal_length: true
    ba_refine_principal_point: false
    ba_refine_extra_params: true
    ba_refine_sensor_from_rig: true
    ba_local_function_tolerance: 0.0
    ba_local_max_num_iterations: -1
    ba_global_frames_ratio: 1.1
    ba_global_points_ratio: 1.1
    ba_global_frames_freq: 500
    ba_global_points_freq: 250000
    ba_global_function_tolerance: 0.0
    ba_global_max_num_iterations: -1
    ba_local_max_refinements: 2
    ba_local_max_refinement_change: 0.001
    ba_global_max_refinements: 5
    ba_global_max_refinement_change: 0.0005
    ba_use_gpu: false
    ba_gpu_index: "-1"
    ba_local_backend: null
    ba_global_backend: null
    ba_min_num_residuals_for_cpu_multi_threading: 50000
    snapshot_path: null
    snapshot_frames_freq: 0
    fix_existing_frames: false
    max_runtime_seconds: null

  incremental_mapper:
    init_min_num_inliers: 100
    init_max_error: 4.0
    init_max_forward_motion: 0.95
    init_min_tri_angle: 16.0
    init_max_reg_trials: 2
    abs_pose_max_error: 12.0
    abs_pose_min_num_inliers: 30
    abs_pose_min_inlier_ratio: 0.25
    filter_max_reproj_error: 4.0
    filter_min_tri_angle: 1.5
    max_reg_trials: 3
    ba_local_num_images: 6
    ba_local_min_tri_angle: 6.0
    ba_global_ignore_redundant_points3D: false
    ba_global_ignore_redundant_points3D_min_coverage_gain: 0.05

  triangulation:
    tri_max_transitivity: 1
    tri_create_max_angle_error: 2.0
    tri_continue_max_angle_error: 2.0
    tri_merge_max_reproj_error: 4.0
    tri_complete_max_reproj_error: 4.0
    tri_complete_max_transitivity: 5
    tri_re_max_angle_error: 5.0
    tri_re_min_ratio: 0.2
    tri_re_max_trials: 1
    tri_min_angle: 1.5
    tri_ignore_two_view_tracks: true

  patch_match:
    max_image_size: 480
    window_radius: 5
    window_step: 1
    sigma_spatial: 5.0
    sigma_color: 0.2
    num_samples: 15
    ncc_sigma: 0.6
    min_triangulation_angle: 1.0
    incident_angle_sigma: 0.9
    num_iterations: 5
    geom_consistency: false
    geom_consistency_regularizer: 0.3
    geom_consistency_max_cost: 3.0
    filter: true
    filter_min_ncc: 0.1
    filter_min_triangulation_angle: 3.0
    filter_min_num_consistent: 2
    filter_geom_consistency_max_cost: 1.0
    num_threads: -1
    write_consistency_graph: false
    allow_missing_files: false
    depth_min: 0.1
    depth_max: 500.0

  stereo_fusion:
    max_image_size: 480
    min_num_pixels: 5
    max_num_pixels: 10000
    max_traversal_depth: 100
    max_reproj_error: 2.0
    max_depth_error: 0.01
    max_normal_error: 10.0
    check_num_images: 50
    use_cache: false
    cache_size: 32
    mask_path: null

  depth_source: photometric      # "photometric" or "geometric"

  # --- pixsfm's own refinement knobs (see this file's header for the memory/runtime guide) ---

  dense_features:
    model:
      name: s2dnet
      num_layers: 1               # more layers = more scale-invariant but slower/more memory
      checkpointing: null
      output_dim: 128
      pretrained: s2dnet           # "s2dnet", "imagenet", or null (random init)
      remove_pooling_layers: false
      combine: false
    device: auto                   # "cpu", "cuda", or "auto" (cuda if available)
    dtype: half                    # "half", "float", or "double" -- storage precision
    fast_image_load: false
    l2_normalize: true
    max_edge: 1600                 # downscale images so the longer side is at most this (px)
    patch_size: 16                 # MEMORY: see this file's header, item 2
    pyr_scales: [1.0]              # more scales = more memory (concatenated, not averaged)
    resize: LANCZOS
    sparse: true                   # MEMORY: see this file's header, item 1 -- leave this true
    use_cache: false                # MEMORY: see this file's header, item 3
    overwrite_cache: false
    load_cache_on_init: false
    cache_format: chunked

  interpolation:
    nodes: [[0.0, 0.0]]            # sample offsets (px) around each keypoint
    mode: BICUBIC                  # or "BILINEAR", "NEAREST", "BICUBIC_GRAD"
    l2_normalize: true
    ncc_normalize: false           # only meaningful with len(nodes) > 1
    use_float_simd: false

  ka:
    # Keypoint adjustment -- refines 2D keypoints from tentative matches, before `colmap mapper`.
    apply: true
    strategy: featuremetric        # or "topological_reference" -- see this file's header, item 4
    level_indices: null            # null = every level, coarse-to-fine
    max_kps_per_problem: 50        # MEMORY/RUNTIME: see this file's header, item 4
    split_in_subproblems: true
    optimizer:
      loss:
        name: cauchy
        params: [0.25]
      solver:
        function_tolerance: 0.0
        gradient_tolerance: 0.0
        parameter_tolerance: 1.0e-05
        minimizer_progress_to_stdout: false
        max_num_iterations: 100
        max_linear_solver_iterations: 200
        max_num_consecutive_invalid_steps: 10
        max_consecutive_nonmonotonic_steps: 10
        use_inner_iterations: false
        use_nonmonotonic_steps: false
        update_state_every_iteration: false
        num_threads: 1
      print_summary: false
      bound: 4.0                   # max pixel displacement from the original keypoint location
      num_threads: -1
      root_regularize_weight: -1   # strategy=featuremetric only
      weight_by_sim: true          # strategy=featuremetric only
      root_edges_only: false       # strategy=featuremetric only

  ba:
    # Bundle adjustment -- refines the merged model's poses and 3D points, before the dense stage.
    apply: true
    strategy: feature_reference    # or "costmaps" -- see this file's header, item 5. Also
                                    # "patch_warp"/"geometric" (own extra sub-conf, not modeled
                                    # here -- edit run_sequence.py directly if you need those)
    level_indices: null
    max_tracks_per_problem: 10     # MEMORY/RUNTIME: see this file's header, item 5
    optimizer:
      loss:
        name: cauchy
        params: [0.25]
      solver:
        function_tolerance: 0.0
        gradient_tolerance: 0.0
        parameter_tolerance: 0.0
        minimizer_progress_to_stdout: false
        max_num_iterations: 100
        max_linear_solver_iterations: 200
        max_num_consecutive_invalid_steps: 10
        max_consecutive_nonmonotonic_steps: 10
        use_inner_iterations: true
        use_nonmonotonic_steps: false
        update_state_every_iteration: false
        num_threads: -1
      print_summary: false
      refine_focal_length: true
      refine_principal_point: false
      refine_extra_params: true    # distortion parameters
      refine_extrinsics: true      # camera poses
    references:
      # How BA computes the fixed per-point3D reference it optimizes towards
      # (strategy=feature_reference only).
      loss:
        name: cauchy
        params: [0.25]
      iters: 100
      keep_observations: false     # MEMORY: leave false -- see this file's header, item 5's note
      compute_offsets3D: false
      num_threads: -1
    costmaps:
      # Only used when strategy=costmaps.
      loss:
        name: trivial
        params: []
      as_gradientfield: true
      compute_cross_derivative: false
      num_threads: -1

output:
  # -> predictions/{method}/{illumination}/{depths,cam_params}/soil={soil},traj={traj}/
  #    predictions/{method}/{illumination}/clouds/soil={soil},traj={traj}.ply
  # (keyed by the full variant, so runs on different illumination/soil never overwrite each other)
  #
  # Unlike the feed-forward baselines: Pixel-Perfect SfM is classical SfM + featuremetric
  # refinement, not a depth model -- only frames COLMAP actually registered get written at all,
  # and a registered frame patch_match_stereo never estimated a depth map for still falls back to
  # all-NaN. Pose and cloud are fully written either way, but scale is left unrecovered (see
  # run_sequence.py's module docstring) -- only rotation+translation are aligned to gt, the same
  # accepted convention baselines/colmap and VGGT-SLAM/VGGT-Long use.
  method: null                  # null = the baseline's registered name ("pixel-perfect-sfm");
                                # set it to run two configurations of the same baseline side by side
  overwrite: false              # false = skip sequences that already have predictions
  min_confidence: null          # produces no per-pixel confidence map -- must stay null
  cloud: true                    # dense fused point cloud from stereo_fusion, not sparse SfM points
